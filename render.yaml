services:
  - type: web
    name: nexum-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: "openrouter"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXUM_AUTH_ENABLED
        value: "true"
      - key: NEXUM_AUTH_SECRET
        sync: false
      - key: NEXUM_DATABASE_URL
        sync: false
      - key: NEXUM_CORS_ORIGINS
        sync: false
