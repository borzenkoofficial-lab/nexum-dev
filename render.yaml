services:
  - type: web
    name: nexum-dev
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: "anymodel"
      - key: ANYMODEL_API_KEY
        sync: false
      - key: ANYMODEL_MODEL
        value: "gpt-6-astra"
      - key: ANYMODEL_BASE_URL
        value: "https://anymodel.org/v1"
      - key: NEXUM_AUTH_ENABLED
        value: "true"
      - key: NEXUM_AUTH_SECRET
        sync: false
      - key: NEXUM_DATABASE_URL
        sync: false
      - key: NEXUM_CORS_ORIGINS
        sync: false
