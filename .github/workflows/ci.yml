name: NEXUM CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API
        run: npm install --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Typecheck API
        run: npm --prefix apps/api run typecheck
      - name: Test API
        run: npm --prefix apps/api run test
      - name: Test Web Runtime
        run: npm --prefix apps/web run test:runtime
      - name: Typecheck Web
        run: npm --prefix apps/web run typecheck
      - name: Build Web
        run: npm --prefix apps/web run build
      - name: Lint Web
        run: npm --prefix apps/web run lint

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API
        run: npm install --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Install E2E
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Run Runtime Phase 2.5 E2E
        run: npm --prefix e2e test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: nexum-runtime-e2e-report
          path: e2e/playwright-report/
          retention-days: 14
