name: NEXUM CI

permissions:
  contents: read

concurrency:
  group: nexum-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feat/ai-loop-production-overhaul", "fix/p0-production-hardening"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Audit Agent Loop
        run: npm run audit:agent-loop
      - name: Install API
        run: npm ci --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Typecheck API
        run: npm --prefix apps/api run typecheck
      - name: Test API
        run: npm --prefix apps/api run test
      - name: Test Web Runtime
        run: npm --prefix apps/web run test:runtime
      - name: Typecheck Web
        run: npm --prefix apps/web run typecheck
      - name: Build API
        run: npm --prefix apps/api run build
      - name: Build Web
        run: npm --prefix apps/web run build
      - name: Lint Web
        run: npm --prefix apps/web run lint
      - name: Build production Docker image
        run: docker build --tag nexum-dev:ci .
      - name: Build isolated sandbox worker image
        run: docker build --target sandbox-worker --tag nexum-dev:sandbox-worker .
      - name: Smoke test production container startup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name nexum-smoke -p 127.0.0.1:3301:3001 -e PORT=3001 -e HOST=0.0.0.0 -e AI_PROVIDER=anymodel -e NEXUM_AUTH_ENABLED=true -e NEXUM_AUTH_SECRET=ci-only-test-secret-at-least-32-characters nexum-dev:ci
          trap 'docker rm -f nexum-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --fail http://127.0.0.1:3301/api/health 2>/dev/null || true)"
            if [ -n "$response" ]; then
              printf '%s\n' "$response"
              if printf '%s' "$response" | grep -q '"service":"NEXUM.DEV API"'; then
                echo "Production container started and /api/health responded."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Production container did not return the expected health response."
          docker logs nexum-smoke || true
          exit 1

      - name: Smoke test isolated sandbox worker execution
        shell: bash
        run: |
          set -euo pipefail
          docker pull node:22-bookworm-slim
          docker volume create nexum-runtime-ci >/dev/null
          docker run --rm --mount type=volume,src=nexum-runtime-ci,dst=/app/runtime node:22-bookworm-slim sh -c 'mkdir -p /app/runtime/ci-project'
          docker run --detach --name nexum-sandbox-worker-ci \
            -p 127.0.0.1:3302:3020 \
            -e NEXUM_SANDBOX_WORKER_SECRET=ci-only-worker-secret-at-least-32-characters \
            -e NEXUM_SANDBOX_WORKER_PORT=3020 \
            -e NEXUM_SANDBOX_VOLUME=nexum-runtime-ci \
            -e NEXUM_SANDBOX_VOLUME_ROOT=/app/runtime \
            --mount type=volume,src=nexum-runtime-ci,dst=/app/runtime \
            --mount type=bind,src=/var/run/docker.sock,dst=/var/run/docker.sock \
            nexum-dev:sandbox-worker
          cleanup() {
            docker rm -f nexum-sandbox-worker-ci >/dev/null 2>&1 || true
            docker volume rm nexum-runtime-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3302/health >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --show-error --fail http://127.0.0.1:3302/health
          node --input-type=module <<'NODE'
          import { createHmac, randomUUID } from "node:crypto";
          const secret = "ci-only-worker-secret-at-least-32-characters";
          const body = JSON.stringify({ projectPath: "ci-project", command: "node --version", timeoutMs: 10000 });
          const timestamp = String(Date.now());
          const nonce = randomUUID();
          const signature = createHmac("sha256", secret).update(timestamp + "." + nonce + "." + body).digest("hex");
          const response = await fetch("http://127.0.0.1:3302/run", {
            method: "POST",
            headers: { "content-type": "application/json", "x-nexum-timestamp": timestamp, "x-nexum-nonce": nonce, "x-nexum-signature": signature },
            body,
          });
          const result = await response.json();
          if (!response.ok || !result.success || !String(result.stdout).includes("v22.")) {
            console.error(JSON.stringify({ status: response.status, result }));
            process.exit(1);
          }
          console.log("Sandbox worker executed an allowlisted command inside the isolated container.");
          NODE

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexum
          POSTGRES_PASSWORD: nexum
          POSTGRES_DB: nexum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexum -d nexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API
        run: npm ci --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Build API
        run: npm --prefix apps/api run build
      - name: Build Web
        run: npm --prefix apps/web run build
      - name: Prepare E2E database
        run: NEXUM_DATABASE_URL=postgresql://nexum:nexum@127.0.0.1:5432/nexum NEXUM_DB_SSL=false npm --prefix apps/api run db:migrate
      - name: Install E2E
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Provision Agent sandbox image
        run: docker pull node:22-bookworm-slim
      - name: Run Runtime Phase 2.5 E2E
        run: npm --prefix e2e test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: nexum-runtime-e2e-report
          path: e2e/playwright-report/
          retention-days: 14
