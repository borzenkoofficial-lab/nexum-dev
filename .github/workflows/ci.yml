name: NEXUM CI

permissions:
  contents: read

concurrency:
  group: nexum-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches: ["main", "feat/ai-loop-production-overhaul", "fix/p0-production-hardening"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Audit Agent Loop
        run: npm run audit:agent-loop
      - name: Install API
        run: npm ci --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Typecheck API
        run: npm --prefix apps/api run typecheck
      - name: Test API
        run: npm --prefix apps/api run test
      - name: Test Web Runtime
        run: npm --prefix apps/web run test:runtime
      - name: Typecheck Web
        run: npm --prefix apps/web run typecheck
      - name: Build API
        run: npm --prefix apps/api run build
      - name: Build Web
        run: npm --prefix apps/web run build
      - name: Lint Web
        run: npm --prefix apps/web run lint
      - name: Build production Docker image
        run: docker build --tag nexum-dev:ci .
      - name: Smoke test production container startup
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name nexum-smoke -p 127.0.0.1:3301:3001 -e PORT=3001 -e HOST=0.0.0.0 -e AI_PROVIDER=anymodel nexum-dev:ci
          trap 'docker rm -f nexum-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            response="$(curl --silent --show-error --fail http://127.0.0.1:3301/api/health 2>/dev/null || true)"
            if [ -n "$response" ]; then
              printf '%s\n' "$response"
              if printf '%s' "$response" | grep -q '"service":"NEXUM.DEV API"'; then
                echo "Production container started and /api/health responded."
                exit 0
              fi
            fi
            sleep 2
          done
          echo "Production container did not return the expected health response."
          docker logs nexum-smoke || true
          exit 1

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexum
          POSTGRES_PASSWORD: nexum
          POSTGRES_DB: nexum
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexum -d nexum"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install API
        run: npm ci --prefix apps/api
      - name: Install Web
        run: npm ci --prefix apps/web
      - name: Build API
        run: npm --prefix apps/api run build
      - name: Build Web
        run: npm --prefix apps/web run build
      - name: Prepare E2E database
        run: NEXUM_DATABASE_URL=postgresql://nexum:nexum@127.0.0.1:5432/nexum NEXUM_DB_SSL=false npm --prefix apps/api run db:migrate
      - name: Install E2E
        run: npm install --prefix e2e --no-audit --no-fund
      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium
      - name: Provision Agent sandbox image
        run: docker pull node:22-bookworm-slim
      - name: Run Runtime Phase 2.5 E2E
        run: npm --prefix e2e test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: nexum-runtime-e2e-report
          path: e2e/playwright-report/
          retention-days: 14
