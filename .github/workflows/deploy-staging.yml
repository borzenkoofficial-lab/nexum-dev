name: Deploy NEXUM.DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nexum-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to REG.RU server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /root/nexum
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose -f docker-compose.staging.yml build --pull
            docker compose -f docker-compose.staging.yml up -d
            docker compose -f docker-compose.staging.yml ps
            docker exec nexum-staging node -e "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1);return r.text()}).then(console.log).catch(e=>{console.error(e);process.exit(1)})"
