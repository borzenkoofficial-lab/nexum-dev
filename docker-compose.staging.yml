name: nexum-staging

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      AI_PROVIDER: anymodel
      NEXUM_SANDBOX_WORKER_URL: http://sandbox-worker:3020
      NEXUM_SANDBOX_VOLUME: nexum-runtime
      NEXUM_SANDBOX_VOLUME_ROOT: /app/runtime
      NEXUM_CORS_ORIGINS: https://${NEXUM_DOMAIN}
    volumes:
      - nexum-runtime:/app/runtime
    depends_on:
      sandbox-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - nexum-internal

  sandbox-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: sandbox-worker
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      NODE_ENV: production
      NEXUM_SANDBOX_WORKER_HOST: 0.0.0.0
      NEXUM_SANDBOX_WORKER_PORT: "3020"
      NEXUM_SANDBOX_VOLUME: nexum-runtime
      NEXUM_SANDBOX_VOLUME_ROOT: /app/runtime
    volumes:
      - nexum-runtime:/app/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "docker version --format '{{.Server.Version}}' >/dev/null 2>&1 && node -e \"fetch('http://127.0.0.1:3020/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - nexum-internal

  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file:
      - .env.staging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - nexum-internal

volumes:
  nexum-runtime:
    name: nexum-runtime
  caddy-data:
  caddy-config:

networks:
  nexum-internal:
    driver: bridge
