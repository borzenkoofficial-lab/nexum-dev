services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: kvard-api:local
    restart: unless-stopped
    init: true
    user: "1000:1000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    volumes:
      - type: bind
        source: ${KVARD_DATA_DIR:-/srv/kvard/data}
        target: /app/runtime
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 120s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(async (r) => { const body = await r.json(); if (!r.ok || body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      KVARD_DOMAIN: ${KVARD_DOMAIN:?Set KVARD_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/timeweb/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
